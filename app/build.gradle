apply plugin: 'com.android.application'

android {
    namespace 'com.team2073.eagleforcescoutingapplication'
    compileSdkVersion 33
    defaultConfig {
        applicationId 'com.team2073.eagleforcescoutingapplication'
        minSdkVersion 25
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures{
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/library-core_release.kotlin_module'
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0"

    // Core AndroidX libraries (consolidated and updated)
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.8.0' // Updated from a pre-alpha version
    implementation 'androidx.cardview:cardview:1.0.0' // CORRECTED: Replaced the old support library
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.annotation:annotation:1.6.0'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    // RxJava & Timber
    implementation 'io.reactivex:rxjava:1.3.8' // Minor update
    implementation 'com.jakewharton.timber:timber:5.0.1' // Updated to version 5

    // OpenCSV
    implementation group: 'com.opencsv', name: 'opencsv', version: '5.7.1'

    // Material Drawer
    implementation "com.mikepenz:materialdrawer:6.1.2"

    // ZXing (QR Code Scanner)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    apply plugin: 'com.android.application'
    apply plugin: 'kotlin-android' // <-- ADD THIS LINE

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
